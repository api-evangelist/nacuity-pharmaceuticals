generated: '2026-08-04'
method: probed
source: >-
  Live anonymous probes of https://www.nacuity.com/wp-json/ plus the WordPress REST route index,
  2026-08-04. Nacuity Pharmaceuticals publishes no authentication documentation of its own.
api: nacuity-pharmaceuticals-content-api
summary: >-
  The Nacuity Pharmaceuticals content API declares NO authentication schemes. The REST index at
  /wp-json/ returns `"authentication": []`, meaning WordPress core has no application-password or
  other REST authentication provider registered for anonymous negotiation. The read operations
  catalogued in this repo require no credentials at all. Everything else — writes, users, settings,
  menus, themes, plugins, templates, the wp-abilities/v1 capability registry, wordfence/v1 and the
  administrative half of yoast/v1 and exactmetrics/v1 — is refused anonymously with a WordPress
  capability error, and the only credential path is a logged-in WordPress session cookie plus a
  nonce, or an application password issued from wp-admin. Neither is obtainable by a third party,
  and neither is documented publicly, so no scheme is asserted here.
schemes: []
