aid: nacuity-pharmaceuticals
name: Nacuity Pharmaceuticals
description: >-
  Nacuity Pharmaceuticals, Inc. is a clinical-stage biopharmaceutical company headquartered in Fort
  Worth, Texas, with operations in Carlton South, Victoria, Australia. It develops targeted
  therapeutics against oxidative stress, the mechanism it holds responsible for a family of blinding
  eye diseases and chronic conditions. Its lead asset, NPI-001 (N-acetylcysteine amide) tablets, is
  in development for retinitis pigmentosa and holds U.S. FDA Breakthrough Therapy, Fast Track and
  Orphan Drug designations; the SLO-RP Phase 1/2 trial reported significantly lower photoreceptor
  loss than placebo from six months through the 24-month study in retinitis pigmentosa associated
  with Usher syndrome. A second programme, NPI-002, is an intravitreal implant for the delay of
  cataract progression and has completed implantation in the final cohort of its Phase 1/2 trial. A
  third programme addresses cystinosis. The company licensed its founding technology from Johns
  Hopkins University, is backed by Foundation Fighting Blindness and its venture arm the RD Fund,
  and partners with Arctic Therapeutics on AT-001 for hereditary cystatin C amyloid angiopathy.
  Nacuity Pharmaceuticals runs no developer program and publishes no product API, no developer
  portal and no API documentation; the only machine-readable surface reachable without credentials
  is the WordPress REST content API behind www.nacuity.com, catalogued here.
