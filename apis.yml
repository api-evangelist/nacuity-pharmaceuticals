apis:
- aid: nacuity-pharmaceuticals:nacuity-pharmaceuticals-content-api
  name: Nacuity Pharmaceuticals Content API
  description: >-
    The anonymously readable WordPress REST API behind www.nacuity.com. It exposes the 29 published
    corporate and clinical-programme pages (Home, About Us, Our Science, Pipeline, Development
    Programs, Investors & Collaborators, News, Medical Information, Publications, Expanded Access
    Policy, References, Contact, Privacy Policy, Disclaimer, plus 17 press releases), the 140-item
    media library, the registered post types, taxonomies and statuses, cross-content search, the
    oEmbed 1.0 provider endpoint, and the Yoast SEO head renderer that carries the site's schema.org
    JSON-LD graph. Two things a consumer must know. First, `content.rendered` and
    `excerpt.rendered` are EMPTY STRINGS on all 29 pages — the bodies are authored in Slider
    Revolution / page-builder post meta that WordPress does not project into REST, so the API yields
    identity, hierarchy, dates and SEO metadata but not prose. Second, the `posts` collection is
    registered but empty and the RSS feed carries no items, because every press release is authored
    as a child page of the News page (id 99) rather than as a post. This is not a developer product
    Nacuity Pharmaceuticals markets; it is the site's own content surface, registered at /wp-json/
    and verified to return data without credentials. The OpenAPI in this repo is derived from the
    published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://www.nacuity.com/wp-json
  tags:
  - content
  - wordpress
  - corporate
  - media
