    url: data-model/nacuity-pharmaceuticals-data-model.yml
  - type: JSONLD
    url: json-ld/nacuity-pharmaceuticals-json-ld.yml
  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://www.nacuity.com/wp-json/ — 211 routes across the namespaces oembed/1.0,
    sliderrevolution, wordfence/v1, yoast/v1, exactmetrics/v1, wp/v2, wp-site-health/v1,
    wp-block-editor/v1 and wp-abilities/v1 — and verified against live anonymous responses on
    2026-08-04. Only the 22 operations that returned data without credentials are modelled. Notably
    the site registers the WordPress Abilities API (`wp-abilities/v1`), an agent-facing capability
    registry, but every endpoint under it returns 401 rest_forbidden anonymously, so no agent
    surface is claimed here. /wp/v2/users returns 401 rest_user_cannot_view, /wp/v2/settings returns
    401 rest_forbidden, /wp/v2/comments returns 403 rest_comment_disabled, and the themes, plugins,
    templates, menus, widgets and block-pattern collections all return 401. Nacuity Pharmaceuticals
    publishes no developer documentation, no API reference, no getting-started guide and no support
    channel for this surface, so no Documentation/APIReference/GettingStarted pointers are emitted;
    the humanURL above is the upstream WordPress REST handbook that defines the wp/v2 contract.
