retry_guidance: >-
  401 and 403 on this API are terminal for an anonymous client — there is no credential a third
  party can obtain, so retrying or backing off will not help. 400 is terminal until the parameter is
  corrected. 404 is terminal for that id. Only 5xx warrants a retry; none was observed.
